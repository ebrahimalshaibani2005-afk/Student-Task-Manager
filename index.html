
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>✳ Tasker</h2>
    <nav>Overview | My Tasks | Projects</nav>
  </header>

  <div class="welcome">
    <h1>Welcome to Tasker 👋</h1>
    <p>Manage your student tasks easily.</p>
    <button onclick="addTask()">+ Add New Task</button>
  </div>

  <h2>My Dashboard</h2>

  <div class="stats">
    <div class="orange">
      <p>Total Tasks</p>
      <h1 id="total">0</h1>
    </div>

    <div class="green">
      <p>Completed</p>
      <h1 id="completed">0</h1>
    </div>

    <div class="purple">
      <p>Pending</p>
      <h1 id="pending">0</h1>
    </div>
  </div>

  <div class="card">
    <h2>My Tasks</h2>

    <input
      type="text"
      id="search"
      placeholder="Search tasks..."
      oninput="showTasks()"
    >

    <select id="filter" onchange="showTasks()">
      <option value="all">All Tasks</option>
      <option value="pending">Pending</option>
      <option value="completed">Completed</option>
    </select>

    <div id="taskList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
